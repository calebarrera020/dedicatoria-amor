<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="love-card">
        <section class="message">
            <div class="dedication">
                <h1>Para el amor de mi vida:</h1>
                <p>
                    Si pudiera elegir un lugar seguro, ser&iacute;a a tu lado.<br>
                    Cuanto m&aacute;s tiempo estoy contigo, m&aacute;s te amo.
                </p>
            </div>

            <div class="elapsed-time">
                <h2>Mi amor por ti comenz&oacute; hace...</h2>
                <div id="counter" aria-live="polite"></div>
            </div>
        </section>

        <section class="tree" aria-label="Arbol con forma de corazon">
            <div class="leaves" aria-hidden="true"></div>
            <div class="branch branch-left"></div>
            <div class="branch branch-right"></div>
            <div class="trunk"></div>
        </section>

        <div class="ground"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
